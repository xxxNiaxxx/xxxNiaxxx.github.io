# Nightly encrypted backup of the production database.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL  the Neon connection string (direct, not "-pooler")
#   BACKUP_PASSPHRASE    a long passphrase; keep a copy somewhere safe, it is
#                        the only way to open the backups
#
# The repository is public, so the dump is encrypted (AES-256) before it is
# stored as a workflow artifact; artifacts are kept for 30 days.
# Restore: download the artifact, then
#   gpg --decrypt backup.sql.gz.gpg | gunzip | psql "$TARGET_DATABASE_URL"
name: Database backup

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets
        id: check
        env:
          URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$URL" ] || [ -z "$PASS" ]; then
            echo "BACKUP_DATABASE_URL / BACKUP_PASSPHRASE are not set: skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dump, compress and encrypt
        if: steps.check.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          docker run --rm -e DATABASE_URL postgres:17 pg_dump --no-owner --no-privileges "$DATABASE_URL" \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase-fd 3 -o backup.sql.gz.gpg 3<<<"$BACKUP_PASSPHRASE"
          ls -lh backup.sql.gz.gpg
          test "$(stat -c %s backup.sql.gz.gpg)" -gt 1000

      - name: Store
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.sql.gz.gpg
          retention-days: 30
          if-no-files-found: error
